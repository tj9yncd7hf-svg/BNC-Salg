name: E-postjobb (BNC Selger)

# Sender e-post som ligger klar i køen: besøksrapporter (samme dag), «takk for
# besøket» (2 virkedager etter) og ukesoppsummeringer. Kjører hver time.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: bnc-selger-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          for a in 1 2 3; do pip install --retries 5 --timeout 60 requests && break; [ "$a" = 3 ] && exit 1; sleep $((a*20)); done
      - name: Send e-post fra køen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
        run: python scripts/email_worker.py
